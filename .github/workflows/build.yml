name: Build ArmeniaRP Launcher

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Frontend tests
        run: npm test

      - name: Typecheck and build
        run: npm run build

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: armeniarp-frontend
          path: dist
          if-no-files-found: error

  windows-build:
    needs: frontend
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: Download frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: armeniarp-frontend
          path: dist

      - name: Generate Armenian Tauri icons
        shell: pwsh
        run: |
          $svg = @'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#151b28"/>
                <stop offset="1" stop-color="#070910"/>
              </linearGradient>
              <clipPath id="shield">
                <path d="M128 22 211 53v67c0 56-31 92-83 114-52-22-83-58-83-114V53Z"/>
              </clipPath>
            </defs>
            <rect width="256" height="256" rx="58" fill="url(#bg)"/>
            <g clip-path="url(#shield)">
              <rect x="40" y="22" width="176" height="71" fill="#d90012"/>
              <rect x="40" y="93" width="176" height="70" fill="#0033a0"/>
              <rect x="40" y="163" width="176" height="71" fill="#f2a800"/>
            </g>
            <path d="M128 22 211 53v67c0 56-31 92-83 114-52-22-83-58-83-114V53Z" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="5"/>
            <circle cx="128" cy="128" r="36" fill="#070910" fill-opacity=".72"/>
            <path d="M108 128h40M128 108v40" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".95"/>
          </svg>
          '@

          New-Item -ItemType Directory -Force src-tauri | Out-Null
          Set-Content -Path src-tauri/armeniarp.svg -Value $svg -Encoding UTF8
          npx tauri icon src-tauri/armeniarp.svg -o src-tauri/icons

          if (!(Test-Path "src-tauri/icons/icon.ico")) {
            throw "Tauri icon generation did not create icon.ico"
          }

          Write-Host "Generated Armenian Tauri icons:"
          Get-ChildItem src-tauri/icons | Select-Object Name, Length

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tauri build
        shell: pwsh
        run: |
          $attempts = 2
          for ($i = 1; $i -le $attempts; $i++) {
            Write-Host "Tauri build attempt $i/$attempts"
            npm run tauri build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $attempts) {
              Write-Warning "Tauri build failed; retrying once using the cached Rust build."
            }
          }
          exit 1

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: armeniarp-launcher-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    needs: windows-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: armeniarp-launcher-windows
          path: release

      - name: Show downloaded files
        shell: bash
        run: find release -type f -maxdepth 5 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: ArmeniaRP Launcher v0.1.0
          body: |
            # ArmeniaRP Launcher v0.1.0

            🇦🇲 Պաշտոնական ArmeniaRP Launcher-ի առաջին հանրային թողարկումը։

            ## Windows
            - ArmeniaRP Launcher x64 Setup
            - MSI Installer

            ## Նոր դիզայն
            - Հայերեն ինտերֆեյս
            - Հայաստանի եռագույնով բրենդավորում
            - Նոր լոգո և premium dark UI
          files: |
            release/**/*.exe
            release/**/*.msi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
